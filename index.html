<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QE Mentor Lookup</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #5d6576;
      --accent: #1f5fbf;
      --accent-text: #ffffff;
      --border: #d5d9e0;
      --error: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c;
        --card: #1e232b;
        --text: #e8eaee;
        --muted: #a0a7b4;
        --accent: #5b9cf5;
        --accent-text: #0d1117;
        --border: #343b47;
        --error: #f28b82;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
    }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    p.lead { margin: 0 0 20px; color: var(--muted); }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    .row { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 1rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    input:focus, button:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      padding: 10px 16px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent-text);
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    #result { margin-top: 20px; min-height: 1.5em; }
    #result .label { color: var(--muted); font-size: 0.9rem; }
    #result .mentor { font-size: 1.3rem; font-weight: 700; }
    #result.error { color: var(--error); }
  </style>
</head>
<body>
  <main>
    <h1>QE Mentor Lookup</h1>
    <p class="lead">Enter your student number to see who your mentor is.</p>
    <form id="lookup" autocomplete="off">
      <label for="student-id">Student number</label>
      <div class="row">
        <input id="student-id" name="student-id" inputmode="numeric" placeholder="e.g. 2612695" required>
        <button type="submit">Find</button>
      </div>
    </form>
    <div id="result" aria-live="polite"></div>
  </main>

  <script src="data.js"></script>
  <script>
    const form = document.getElementById("lookup");
    const input = document.getElementById("student-id");
    const result = document.getElementById("result");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const id = input.value.replace(/\D/g, "");
      const entry = window.MENTORS[id];
      result.className = "";
      result.textContent = "";
      if (!entry) {
        result.className = "error";
        result.textContent = "No mentor found for that student number. Please check it and try again, or contact the programme coordinator.";
        return;
      }
      const label = document.createElement("div");
      label.className = "label";
      label.textContent = `${entry.year} · Your mentor`;
      const mentor = document.createElement("div");
      mentor.className = "mentor";
      mentor.textContent = entry.mentor;
      result.append(label, mentor);
    });
  </script>
</body>
</html>
